# Installed by hand as .github/workflows/conformance.yml in sferarc/pgserverless; the forward sync never writes .github.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: corpus and driver suite on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      UPSTREAM_URL: postgres://app:pw@127.0.0.1:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the server and the corpus runner
        run: |
          go build -o "$RUNNER_TEMP/pgserverless" ./cmd/pgserverless
          go build -o "$RUNNER_TEMP/pgsconform" ./cmd/pgsconform

      - name: Conformance corpus
        run: |
          DATABASE_URL="$UPSTREAM_URL" PGSERVERLESS_ADDR=127.0.0.1:4000 "$RUNNER_TEMP/pgserverless" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 50); do
            curl -fsS http://127.0.0.1:4000/health >/dev/null 2>&1 && break
            kill -0 "$server_pid" 2>/dev/null || exit 1
            sleep 0.2
          done
          "$RUNNER_TEMP/pgsconform" -cases spec/cases/v1.json -server http://127.0.0.1:4000 -single-database -dsn "$UPSTREAM_URL" -report "$RUNNER_TEMP/pgsconform-report.json"

      # The suite has no lockfile of its own; package.json pins exact versions.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          mise_toml: |
            [tools]
            node = "26.12.1"
            pnpm = "12.14.0"

      - name: Install the driver suite
        working-directory: driver-conformance
        run: pnpm install --no-frozen-lockfile

      - name: Driver suite
        working-directory: driver-conformance
        env:
          PGSERVERLESS_BIN: ${{ runner.temp }}/pgserverless
        run: pnpm test:go-server
